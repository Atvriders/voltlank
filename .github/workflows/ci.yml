name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. The docker job re-declares the one extra scope it
# needs (packages: write).
permissions:
  contents: read

env:
  # Not a secret: CI needs a valid signing key to boot the app; env validation
  # rejects short/placeholder values. Generated with `openssl rand -hex 32`;
  # never used by any deployment.
  JWT_SECRET: da1ed84cbe380e8b2639006b5bdfcdce0ebc47754ca248e1277b16a8f8be4093
  VL_MASTER_KEY: MWY0MjZiYTc5OGIxMzQ3M2FkYTlmNjJmYzM3M2I0YzQ=
  DATABASE_URL: postgresql://voltlank:voltlank@127.0.0.1:5432/voltlank

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: voltlank
          POSTGRES_PASSWORD: voltlank
          POSTGRES_DB: voltlank
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U voltlank -d voltlank"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm -w @voltlink/shared run build
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
      - run: npm run typecheck
      - run: npx eslint . --max-warnings=0
      - run: npm test
      - run: npm run build
      - run: npm run legacy:scan
      - run: python3 blender/scripts/validate_assets.py
      - name: Dependency audit (fails on critical)
        run: npm audit --audit-level=critical
      - name: Dependency audit (reports high)
        continue-on-error: true
        run: npm audit --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: voltlank
          POSTGRES_PASSWORD: voltlank
          POSTGRES_DB: voltlank
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U voltlank -d voltlank"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm -w @voltlink/shared run build
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - run: npm -w @voltlink/api run build
      - run: npm -w @voltlink/web run build
      - run: mkdir -p apps/api/web-dist && cp -r apps/web/dist/* apps/api/web-dist/
      - run: npx playwright install --with-deps chromium
      # The API runs its own advisory-lock migration leader at boot.
      - name: Start API (background)
        run: |
          cd apps/api
          NODE_ENV=development PORT=3111 node dist/index.cjs > /tmp/voltlink-api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3111/healthz && break; sleep 1; done
      - name: API smoke (register → demo → vehicles)
        run: |
          node - <<'EOF'
          const base = 'http://127.0.0.1:3111';
          (async () => {
            const csrfRes = await fetch(base + '/api/v1/auth/csrf');
            const csrfCookie = csrfRes.headers.getSetCookie()[0].split(';')[0];
            const token = (await csrfRes.json()).data.token;
            const h = { 'content-type': 'application/json', cookie: csrfCookie, 'x-vl-csrf': token };
            const reg = await fetch(base + '/api/v1/auth/register', { method: 'POST', headers: h, body: JSON.stringify({ name: 'Smoke', email: `smoke-${Date.now()}@ci.test`, password: 'smoke-password-123' }) });
            console.log('register:', reg.status);
            const sess = reg.headers.getSetCookie().map(c => c.split(';')[0]).find(c => c.startsWith('vl_session'));
            const h2 = { 'content-type': 'application/json', cookie: `${csrfCookie}; ${sess}`, 'x-vl-csrf': token };
            const demo = await fetch(base + '/api/v1/providers/demo/connect', { method: 'POST', headers: h2 });
            console.log('demo connect:', demo.status, (await demo.json()).data?.vehiclesImported);
            const veh = await fetch(base + '/api/v1/vehicles', { headers: { cookie: `${csrfCookie}; ${sess}` } });
            const vbody = await veh.json();
            console.log('vehicles:', veh.status, vbody.data?.length);
            if (!(reg.status === 201 && demo.status === 200 && veh.status === 200 && vbody.data?.length >= 5)) process.exit(1);
          })().catch(e => { console.error(e); process.exit(1); });
          EOF
      - run: npx playwright test --reporter=list
      - name: API log
        if: always()
        run: tail -60 /tmp/voltlink-api.log

  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Committed GLBs must pass container/part-name validation and match the
      # manifest (regenerating with Blender happens in development; CI checks
      # the committed artifacts so a broken rebuild cannot ship silently).
      - run: python3 blender/scripts/validate_assets.py
      - run: test -f apps/web/public/assets/models/manifest.json

  docker:
    runs-on: ubuntu-latest
    needs: [build-and-test, e2e, assets]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.server_url == 'https://github.com'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: voltlank:ci
      - name: Scan image for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: voltlank:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: docker/.trivyignore
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.server_url == 'https://github.com' }}
          provenance: true
          sbom: true
          tags: |
            ghcr.io/atvriders/voltlank:latest
            ghcr.io/atvriders/voltlank:v1.0.0
            ghcr.io/atvriders/voltlank:${{ github.sha }}

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
