# VoltLink production stack — consumes the published GHCR image
# (ghcr.io/atvriders/voltlank) and performs no local build.
#
#   curl -fsSL https://raw.githubusercontent.com/Atvriders/voltlank/main/compose.production.yml -o compose.production.yml
#   docker compose -f compose.production.yml up -d

name: voltlank

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: voltlank
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong database password}
      POSTGRES_DB: voltlank
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voltlank -d voltlank"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    image: ghcr.io/atvriders/voltlank:${VOLTLANK_IMAGE_TAG:-latest}
    restart: unless-stopped
    pull_policy: always
    environment: &app_env
      NODE_ENV: production
      VL_ROLE: web
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://voltlank:${POSTGRES_PASSWORD}@postgres:5432/voltlank
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?generate one: openssl rand -hex 32}
      VL_MASTER_KEY: ${VL_MASTER_KEY:?generate one: openssl rand -base64 32}
      PUBLIC_URL: ${PUBLIC_URL:?e.g. https://voltlink.example.com}
      TRUST_PROXY: "true"
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-VoltLink <no-reply@voltlink.local>}
      MAIL_TO_CONSOLE: ${MAIL_TO_CONSOLE:-true}
      TESLA_CLIENT_ID: ${TESLA_CLIENT_ID:-}
      TESLA_CLIENT_SECRET: ${TESLA_CLIENT_SECRET:-}
      TESLA_REDIRECT_URI: ${TESLA_REDIRECT_URI:-https://voltlink.example.com/api/v1/providers/tesla/callback}
      TESSIE_BASE_URL: ${TESSIE_BASE_URL:-https://api.tessie.com}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3110}:3000"

  worker:
    image: ghcr.io/atvriders/voltlank:${VOLTLANK_IMAGE_TAG:-latest}
    restart: unless-stopped
    pull_policy: always
    environment:
      <<: *app_env
      VL_ROLE: worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    image: ghcr.io/atvriders/voltlank:${VOLTLANK_IMAGE_TAG:-latest}
    restart: unless-stopped
    pull_policy: always
    environment:
      <<: *app_env
      VL_ROLE: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
